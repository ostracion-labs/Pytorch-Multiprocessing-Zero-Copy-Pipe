[workspace]
authors = ["Patrick Joel Tirta <patricktirta2000@gmail.com>"]
channels = ['conda-forge']
name = "Zero-Copy-Multiprocess-Image-Processing-Python"
platforms = ['linux-64']
version = "0.1.0"

[tasks]
test = "pytest -v"

[dependencies]
python = ">=3.15.2,<3.16"
numpy = "*"
pytest = "*"

[pypi-dependencies]
torch = { version = "==2.14.1", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.29.1", index = "https://download.pytorch.org/whl/cu126" }
